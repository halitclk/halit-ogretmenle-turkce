<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Okuma Yolculuğum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Düzen: tek sütun uygulama. Öğrencide üstte kitap rafı, altta kitap kartları; öğretmende özet ve sıralanabilir öğrenci listesi. */
:root{
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#F4F0E3; --surface:#FFFFFF; --surface-2:#FAF7EC; --ink:#232A3B; --muted:#6A6555; --line:#DDD4BA;
  --brand:#2F5233; --on-brand:#FFFFFF; --brand-soft:#E3EDDF;
  --accent:#A6402F; --on-accent:#FFFFFF; --gold:#B7821F;
  --good:#2F7A3E; --warn:#9A5A14; --warn-soft:#F6E7D2;
  --s1:#2F6B45; --s2:#A6402F; --s3:#2F5F8F; --s4:#7B3F61; --s5:#1F6F6B; --s6:#8A5A1E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A14; --surface:#1C241C; --surface-2:#222C22; --ink:#ECEADC; --muted:#A5A391; --line:#34402F;
    --brand:#8CC796; --on-brand:#0E1A10; --brand-soft:#24392A;
    --accent:#E58570; --on-accent:#1B0D09; --gold:#E2B550;
    --good:#8ED19A; --warn:#E6A862; --warn-soft:#3A2B17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A14; --surface:#1C241C; --surface-2:#222C22; --ink:#ECEADC; --muted:#A5A391; --line:#34402F;
  --brand:#8CC796; --on-brand:#0E1A10; --brand-soft:#24392A;
  --accent:#E58570; --on-accent:#1B0D09; --gold:#E2B550;
  --good:#8ED19A; --warn:#E6A862; --warn-soft:#3A2B17;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
label{font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--brand)}
.brand svg{width:26px;height:26px}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.status{font-size:12.5px;color:var(--muted)}
.status.err{color:var(--accent);font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.btn.danger.solid{background:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.link{background:none;border:none;padding:6px 2px;color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:20px;color:var(--brand)}

/* Giriş */
.login{max-width:560px;margin:16px auto 0}
.login h1{font-size:28px}
.login .lead{color:var(--muted);margin:6px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.pick{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 10px;min-width:0}
.pick[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pick span.nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.avatar{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--brand-soft);font-size:22px;flex:none;border:0;padding:0}
.avatar.xl{width:76px;height:76px;font-size:42px;border:2px solid var(--line)}
button.avatar:hover{outline:2px solid var(--brand)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.err-t{color:var(--accent);font-weight:600;font-size:13.5px;min-height:20px}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.av-grid button{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-size:26px;padding:0}
.av-grid button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);outline:2px solid var(--brand)}

/* Öğrenci üst alan */
.hero-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-top .who{flex:1;min-width:180px}
.hero-top h1{font-size:26px}
.hero-top .who p{color:var(--muted);font-size:14px}
.goalbox{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:20px;line-height:1;padding:0}
.stepper output{font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--ink);min-width:30px;text-align:center}
.picker{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.prog{display:flex;align-items:center;gap:16px;margin-top:20px}
.pct{font-family:var(--font-display);font-weight:700;font-size:44px;color:var(--brand);line-height:1;min-width:98px}
.pct small{font-size:22px}
.prog strong{font-size:17px}
.shelf{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;margin-top:20px;padding:0 6px;border-bottom:8px solid var(--line);min-height:140px}
.spine{width:30px;border-radius:4px 4px 0 0;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.spine span{writing-mode:vertical-rl;max-height:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 0;font-size:11px;font-weight:600;color:#fff}
.spine.empty{border:2px dashed var(--line);background:transparent}
.spine.part{border:2px dashed var(--c);background:linear-gradient(to top,var(--c) var(--fill),transparent var(--fill))}
.rank{margin-top:18px;display:grid;gap:6px}
.rank-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}
.rank-top b{color:var(--brand)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .5s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--font-display);font-size:26px;color:var(--brand);line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;display:grid;gap:4px;justify-items:center}
.badge .ic{font-size:28px;line-height:1}
.badge b{font-size:12.5px}
.badge small{font-size:11.5px;color:var(--muted)}
.badge.locked{opacity:.5}
.badge.locked .ic{filter:grayscale(1)}

/* Kitaplar */
.add{display:grid;grid-template-columns:1fr 130px auto;gap:10px;align-items:end}
.add .btn{height:44px}
.books{display:grid;gap:12px;margin-top:14px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.book.done{border-color:var(--brand)}
.book-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.book-h h3{font-size:17px;overflow-wrap:anywhere}
.book-h p{font-size:13px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:700;white-space:nowrap;min-height:40px}
.check input{width:24px;height:24px;accent-color:var(--brand);padding:0}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl .rd{display:flex;align-items:center;gap:8px}
.ctrl .rd input{width:84px}
.mini{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;min-height:36px}
.stars{display:flex;gap:2px;margin-left:auto}
.stars button{background:none;border:none;font-size:24px;padding:2px 3px;color:var(--line);line-height:1}
.stars button.on{color:var(--gold)}
details.note summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--brand);padding:4px 0}
details.note textarea{margin-top:8px}
.del-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.empty-state{border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);background:var(--surface)}

/* Öğretmen */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cls-list{display:grid;gap:8px}
.cls-row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;font-size:14px}
.cls-row b{font-family:var(--font-display);font-size:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:160px}
.toolbar select{width:auto;min-width:130px}
.srow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) 80px minmax(0,1fr);gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.srow:hover{border-color:var(--brand)}
.srow .nm{display:flex;align-items:center;gap:10px;min-width:0}
.srow .nm div{min-width:0}
.srow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .nm small{color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-top:2px}
.tag.ok{background:var(--brand-soft);color:var(--brand)}
.pgs{font-variant-numeric:tabular-nums;font-size:14px}
@media(max-width:640px){
  .form-grid{grid-template-columns:1fr}
  .add{grid-template-columns:1fr 1fr}
  .add .btn{grid-column:1/-1}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .stat b{font-size:22px}
  .sum{grid-template-columns:1fr 1fr}
  .srow{grid-template-columns:1fr 1fr;row-gap:8px}
  .srow .nm{grid-column:1/-1}
  .pct{font-size:36px;min-width:84px}
  .av-grid{grid-template-columns:repeat(4,1fr)}
}
.modal{position:fixed;inset:0;background:rgba(10,14,10,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(18px,env(safe-area-inset-top,0px)) 14px 18px;overflow-y:auto;z-index:50}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:640px;display:grid;gap:14px}
.sheet-h{display:flex;align-items:center;gap:14px}
.sheet-h h2{font-size:22px}
.ro-book{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--surface-2)}
.ro-book p.note{white-space:pre-wrap;font-size:14px;background:var(--surface);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--on-brand);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:min(92vw,460px);text-align:center;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:90;pointer-events:none;border-radius:2px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.bar i{transition:none}}
.foot{text-align:center;margin-top:22px}
</style>

<div class="wrap" id="app" aria-live="polite"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
var app=document.getElementById('app');
var AVATARS=['🦊','🐼','🦉','🐯','🐙','🦄','🐸','🐧','🦁','🐨','🐰','🐲'];
var RANKS=[[0,'Yeni Okur'],[1,'Sayfa Çevirici'],[3,'Kitap Kurdu'],[5,'Kütüphane Gezgini'],[8,'Okuma Ustası'],[12,'Okuma Şampiyonu']];
var LS='oy-okuma-yolculugu-v1';

var S={cloud:false,db:null,dl:null,loaded:false,synced:false,students:{},teacherHash:undefined,
  view:'login',me:null,login:{cls:'',id:'',err:''},reg:{av:AVATARS[0],err:''},
  tf:{cls:'',q:'',sort:'name'},ui:{open:{},del:null,av:false,modal:null,modalDel:false,tmsg:''}};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function today(){return new Date().toISOString().slice(0,10);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function slug(s){return String(s).toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'x';}
function rid(){return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function num(v,min,max){var n=parseInt(v,10);if(isNaN(n))n=0;return Math.max(min,Math.min(max,n));}
async function hash(id,pin){
  var str='oy1:'+id+':'+pin;
  try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
  catch(e){var h=5381;for(var i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0;}return 'x'+(h>>>0).toString(16);}
}
function timeAgo(ts){
  if(!ts)return 'henüz yok';
  var d=Math.floor((Date.now()-ts)/86400000);
  if(d<=0)return 'bugün';if(d===1)return 'dün';if(d<30)return d+' gün önce';return Math.floor(d/30)+' ay önce';
}

/* ---------- Hesaplamalar ---------- */
function calc(s){
  var books=s.books||[],done=books.filter(function(b){return b.done;}).length;
  var pages=books.reduce(function(a,b){return a+(b.r||0);},0);
  var pct=s.goal?Math.min(100,Math.round(done/s.goal*100)):0;
  return {done:done,reading:books.length-done,pages:pages,pct:pct};
}
function rankOf(done){var i=0;for(var k=0;k<RANKS.length;k++){if(done>=RANKS[k][0])i=k;}return i;}
function badgesOf(s){
  var books=s.books||[],c=calc(s);
  var notes=books.filter(function(b){return (b.note||'').trim();}).length;
  return [
    {ic:'📖',n:'İlk Kitap',d:'1 kitap bitir',ok:c.done>=1},
    {ic:'📚',n:'Üç Kitap',d:'3 kitap bitir',ok:c.done>=3},
    {ic:'🎯',n:'Hedef Tamam',d:'Hedefine ulaş',ok:s.goal>0&&c.done>=s.goal},
    {ic:'🔖',n:'500 Sayfa',d:'500 sayfa oku',ok:c.pages>=500},
    {ic:'🏔️',n:'1000 Sayfa',d:'1000 sayfa oku',ok:c.pages>=1000},
    {ic:'📝',n:'Not Yazarı',d:'3 kitaba not yaz',ok:notes>=3},
    {ic:'⭐',n:'Beş Yıldız',d:'Bir kitaba 5 yıldız ver',ok:books.some(function(b){return b.star===5;})},
    {ic:'🧱',n:'Kalın Kitap',d:'300+ sayfalık kitabı bitir',ok:books.some(function(b){return b.done&&b.p>=300;})}
  ];
}

/* ---------- Depolama ---------- */
function loadLocal(){
  try{var d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.students=d.students||{};S.teacherHash=d.teacher||null;}}catch(e){}
  if(S.teacherHash===undefined)S.teacherHash=null;
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({students:S.students,teacher:S.teacherHash}));}catch(e){}}
async function persist(s){
  if(S.cloud){await S.db.doc('students/'+s.id).set(s);}
  S.students[s.id]=s;
  if(!S.cloud)saveLocal();
}
async function removeStudent(id){
  if(S.cloud){await S.db.doc('students/'+id).delete();}
  delete S.students[id];
  if(!S.cloud)saveLocal();
}
async function getTeacherHash(){
  if(S.cloud){
    try{var snap=await S.db.doc('config/teacher').get();return snap.exists?(snap.data().hash||null):null;}catch(e){return null;}
  }
  return S.teacherHash||null;
}
async function setTeacherHash(h){
  if(S.cloud){await S.db.doc('config/teacher').set({hash:h});}
  else{S.teacherHash=h;saveLocal();}
}

var saveTimer=null,chain=Promise.resolve();
function setStatus(t){
  var el=document.getElementById('status');if(!el)return;
  el.className='status'+(t==='error'?' err':'');
  el.textContent=t==='saving'?'Kaydediliyor…':t==='saved'?'Kaydedildi ✓':t==='error'?'Kaydedilemedi, tekrar dene':'';
}
function touch(){
  S.me.updated=Date.now();setStatus('saving');
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);
}
function flush(){
  clearTimeout(saveTimer);saveTimer=null;
  if(!S.me)return chain;
  var snap=clone(S.me);
  chain=chain.then(function(){return persist(snap);}).then(function(){setStatus('saved');}).catch(function(){setStatus('error');});
  return chain;
}

/* ---------- Yardımcılar ---------- */
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},3600);
}
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cols=['#2F6B45','#A6402F','#2F5F8F','#B7821F','#7B3F61','#1F6F6B'];
  for(var i=0;i<46;i++){
    var d=document.createElement('i');d.className='conf';
    d.style.left=(Math.random()*100)+'vw';d.style.background=cols[i%cols.length];
    d.style.animationDelay=(Math.random()*.5)+'s';d.style.animationDuration=(1.5+Math.random()*1.2)+'s';
    document.body.appendChild(d);
    (function(x){setTimeout(function(){x.remove();},3200);})(d);
  }
}

function csvExport(){
  var rows=[['Ad Soyad','Sınıf','Hedef','Bitirilen kitap','Toplam okunan sayfa','Kitap adı','Sayfa sayısı','Okunan sayfa','Durum','Puan','Not']];
  Object.keys(S.students).map(function(k){return S.students[k];}).sort(function(a,b){return (a.cls||'').localeCompare(b.cls||'','tr',{numeric:true})||a.name.localeCompare(b.name,'tr');}).forEach(function(s){
    var c=calc(s);
    if(!(s.books||[]).length){rows.push([s.name,s.cls,s.goal,c.done,c.pages,'','','','','','']);return;}
    s.books.forEach(function(b){rows.push([s.name,s.cls,s.goal,c.done,c.pages,b.t,b.p,b.r,b.done?'Bitti':'Devam ediyor',b.star||'',(b.note||'').replace(/\s+/g,' ')]);});
  });
  var txt='\uFEFF'+rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  try {
    var blob = new Blob([txt], {type: 'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'okuma-takip-'+today()+'.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Tablo (CSV) başarıyla indirildi.');
  } catch(e) {
    toast('Tablo indirilemedi.');
  }
}

/* ---------- Olaylar ---------- */
function act(a,t,e){
  var v=t.dataset.v,id=t.dataset.id;
  switch(a){
    case 'pickcls':S.login.cls=v;S.login.id='';S.login.err='';renderLogin();break;
    case 'pickstu':S.login.id=v;S.login.err='';renderLogin();var pw=document.getElementById('li-pw');if(pw)pw.focus();break;
    case 'toreg':S.view='register';S.reg.err='';render();break;
    case 'tologin':S.view='login';S.ui.tmsg='';render();break;
    case 'toteacher':S.view='tlogin';S.ui.tmsg='';
      (async function(){S.teacherHash=await getTeacherHash();render();})();break;
    case 'regav':S.reg.av=v;var g=document.querySelectorAll('[data-act="regav"]');g.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===v);});break;
    case 'logout':flush().then(function(){S.me=null;S.view='login';S.login={cls:'',id:'',err:''};S.ui={open:{},del:null,av:false,modal:null,modalDel:false,tmsg:''};render();});break;
    case 'avtoggle':S.ui.av=!S.ui.av;refreshStudent(['hero']);break;
    case 'setav':S.me.avatar=v;S.ui.av=false;touch();refreshStudent(['hero']);break;
    case 'goal':S.me.goal=num(S.me.goal+parseInt(v,10),1,99);touch();refreshStudent(['hero']);break;
    case 'add':var b=findBook(id);if(b)setRead(b,b.r+parseInt(v,10));break;
    case 'star':var bs=findBook(id);if(bs){bs.star=bs.star===parseInt(v,10)?0:parseInt(v,10);touch();refreshStudent(['books']);}break;
    case 'del':S.ui.del=id;refreshStudent(['books']);break;
    case 'delno':S.ui.del=null;refreshStudent(['books']);break;
    case 'delyes':S.me.books=S.me.books.filter(function(x){return x.id!==id;});S.ui.del=null;touch();refreshStudent(['hero','books']);break;
    case 'tlogout':S.view='login';S.ui.modal=null;render();break;
    case 'openstu':S.ui.modal=id;S.ui.modalDel=false;renderModal();break;
    case 'mclose':S.ui.modal=null;renderModal();break;
    case 'mbg':if(e.target===t){S.ui.modal=null;renderModal();}break;
    case 'studel':S.ui.modalDel=true;renderModal();break;
    case 'stuno':S.ui.modalDel=false;renderModal();break;
    case 'stuyes':var sid=S.ui.modal;removeStudent(sid).then(function(){S.ui.modal=null;S.ui.modalDel=false;renderModal();renderTeacherData();toast('Öğrenci silindi.');}).catch(function(){toast('Silinemedi, tekrar dene.');});break;
    case 'csv':csvExport();break;
  }
}
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t||t.matches('input,textarea'))return;
  act(t.dataset.act,t,e);
});
app.addEventListener('change',function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;
  if(a==='done'){
    var b=findBook(t.dataset.id);if(!b)return;
    var before=calc(S.me).done;
    if(t.checked){b.r=b.p;b.done=true;b.fin=today();touch();refreshStudent(['hero','books']);celebrate(b,before);}
    else{b.done=false;b.fin='';if(b.r>=b.p)b.r=Math.max(0,b.p-1);touch();refreshStudent(['hero','books']);}
  }else if(a==='read'){var bb=findBook(t.dataset.id);if(bb)setRead(bb,t.value);}
  else if(a==='note'){refreshStudent([]);}
  else if(t.id==='tcf'){S.tf.cls=t.value;renderTeacherData();}
  else if(t.id==='tso'){S.tf.sort=t.value;renderTeacherData();}
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.act==='note'){var b=findBook(t.dataset.id);if(b){b.note=t.value;touch();}}
  else if(t.id==='tq'){S.tf.q=t.value;renderTeacherData();}
});
app.addEventListener('toggle',function(e){
  var d=e.target;if(d.matches&&d.matches('details.note[data-id]')){S.ui.open[d.dataset.id]=d.open;}
},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.ui.modal){S.ui.modal=null;renderModal();}});

app.addEventListener('submit',async function(e){
  e.preventDefault();
  var f=e.target.dataset.form;
  if(f==='login'){
    var L=S.login,s=S.students[L.id],pin=document.getElementById('li-pw').value;
    if(!s)return;
    var h=await hash(s.id,pin);
    if(h!==s.pw){L.err='Şifre yanlış, tekrar dene.';renderLogin();return;}
    S.me=clone(s);S.me.books=S.me.books||[];S.view='student';S.ui.av=false;render();
    toast('Hoş geldin, '+s.name.split(' ')[0]+'!');
  }
  else if(f==='register'){
    var name=document.getElementById('r-name').value.trim().replace(/\s+/g,' '),cls=document.getElementById('r-cls').value.trim().toUpperCase(),pw=document.getElementById('r-pw').value,goal=num(document.getElementById('r-goal').value,1,99),err=document.getElementById('r-err');
    if(!name||!cls){err.textContent='Adını ve sınıfını yaz.';return;}
    if(pw.length<4){err.textContent='Şifre en az 4 karakter olmalı.';return;}
    var id=slug(name)+'_'+slug(cls);
    if(S.students[id]){err.textContent='Bu adla bu sınıfta kayıt var. Giriş ekranından gir.';return;}
    var st={id:id,name:name,cls:cls,avatar:S.reg.av,pw:await hash(id,pw),goal:goal,books:[],created:Date.now(),updated:Date.now()};
    try{await persist(st);}catch(x){err.textContent='Kayıt yapılamadı. Biraz sonra tekrar dene.';return;}
    S.me=clone(st);S.view='student';render();toast('Kayıt tamam! İlk kitabını ekleyebilirsin.');
  }
  else if(f==='addbook'){
    var t=document.getElementById('ab-t'),p=document.getElementById('ab-p'),er=document.getElementById('ab-err');
    var title=t.value.trim(),pages=num(p.value,0,3000);
    if(!title||pages<1){er.textContent='Kitabın adını ve sayfa sayısını yaz.';return;}
    er.textContent='';
    S.me.books.push({id:rid(),t:title,p:pages,r:0,done:false,star:0,note:'',fin:'',added:Date.now()});
    t.value='';p.value='';touch();refreshStudent(['hero','books']);toast('Kitap eklendi. İyi okumalar!');
  }
  else if(f==='tlogin'){
    var ok=(await hash('teacher',document.getElementById('t-pw').value))===S.teacherHash;
    if(!ok){S.ui.tmsg='Şifre yanlış.';document.getElementById('t-err').textContent=S.ui.tmsg;return;}
    S.ui.tmsg='';S.view='teacher';render();
  }
  else if(f==='tsetup'){
    var v=document.getElementById('t-pw').value;
    if(v.length<4){document.getElementById('t-err').textContent='En az 4 karakter olmalı.';return;}
    var th=await hash('teacher',v);
    try{await setTeacherHash(th);}catch(x){document.getElementById('t-err').textContent='Kaydedilemedi, tekrar dene.';return;}
    S.teacherHash=th;S.view='teacher';render();
  }
  else if(f==='tchange'){
    var nv=document.getElementById('t-new').value,m=document.getElementById('t-chg');
    if(nv.length<4){m.textContent='En az 4 karakter olmalı.';return;}
    var nh=await hash('teacher',nv);
    try{await setTeacherHash(nh);S.teacherHash=nh;m.textContent='Ana şifre değişti.';document.getElementById('t-new').value='';}catch(x){m.textContent='Kaydedilemedi.';}
  }
  else if(f==='resetpw'){
    var np=document.getElementById('m-pw').value,mm=document.getElementById('m-msg'),stu=S.students[S.ui.modal];
    if(np.length<4){mm.textContent='En az 4 karakter olmalı.';return;}
    var c2=clone(stu);c2.pw=await hash(c2.id,np);
    try{await persist(c2);mm.textContent='Şifre sıfırlandı. Yeni şifre: '+np;document.getElementById('m-pw').value='';}catch(x){mm.textContent='Kaydedilemedi.';}
  }
});

/* ---------- Veri değişince ---------- */
function onData(){
  S.loaded=true;
  var a=document.activeElement,typing=a&&app.contains(a)&&/INPUT|TEXTAREA/.test(a.tagName);
  if(S.view==='teacher'){renderTeacherData();if(S.ui.modal&&!typing)renderModal();}
  else if((S.view==='login')&&!typing)renderLogin();
}

/* ---------- Başlangıç ---------- */
(async function boot(){
  render();
  var db=null;
  try{
    var p=window.claude&&window.claude.use?window.claude.use('db'):null;
    db=await Promise.race([Promise.resolve(p),new Promise(function(r){setTimeout(function(){r(null);},6000);})]);
  }catch(e){db=null;}
  try{
    var dp=window.claude&&window.claude.use?window.claude.use('downloads'):null;
    Promise.resolve(dp).then(function(d){S.dl=d||null;if(S.view==='teacher')render();}).catch(function(){});
  }catch(e){}
  if(db){
    S.cloud=true;S.db=db;
    try{
      db.collection('students').onSnapshot(function(snap){
        var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});
        if(S.me&&S.view==='student')m[S.me.id]=m[S.me.id]||S.me;
        S.students=m;onData();
      },function(){S.cloud=false;loadLocal();S.loaded=true;render();});
    }catch(e){S.cloud=false;loadLocal();S.loaded=true;render();}
    setTimeout(function(){if(!S.loaded&&S.view==='login'){var el=app.querySelector('.login .muted');if(el)el.textContent='Liste yüklenemedi. Bağlantını kontrol edip sayfayı yenile.';}},10000);
  }else{loadLocal();S.loaded=true;render();}
})();
})();
</script>
